<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>征服与统治</title>
<link rel="icon" href="icon.png">
<style>
  :root { --wood:#2b1d14; --wood2:#3a281b; --iron:#1c1d22; --brass:#c9a24a; --parch:#e9dcb5; --ink:#3a2a1a; --red:#8a2a22; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--wood) repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 46px); color: var(--parch);
    font: 16px/1.7 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; justify-content: center; padding: 28px 16px 40px; }
  main { width: 100%; max-width: 560px; }
  .plate { background: var(--parch); color: var(--ink); border: 4px solid var(--iron); outline: 4px solid var(--wood2); box-shadow: 0 6px 0 rgba(0,0,0,.45); padding: 22px 20px; margin-bottom: 22px; }
  .head { display: flex; align-items: center; gap: 16px; }
  .head img { width: 96px; height: 96px; image-rendering: pixelated; border: 4px solid var(--iron); background: var(--wood2); }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; color: var(--red); }
  .sub { margin: 4px 0 0; font-size: 14px; color: #6b553a; }
  h2 { margin: 0 0 8px; font-size: 18px; border-bottom: 2px solid #b9a877; padding-bottom: 4px; }
  ul { margin: 0; padding-left: 20px; }
  p { margin: 0 0 8px; }
  .tag { display: inline-block; background: var(--iron); color: var(--brass); font-size: 13px; padding: 2px 10px; margin-top: 8px; }
  footer { text-align: center; font-size: 13px; color: #a8946a; }
</style>
</head>
<body>
<main>
  <section class="plate">
    <div class="head">
      <img src="icon.png" alt="征服与统治 图标">
      <div>
        <h1>征服与统治</h1>
        <p class="sub">诺玛大陆 · 领主、家族与战争</p>
        <span class="tag">测试中</span>
      </div>
    </div>
  </section>
  <section class="plate">
    <h2>这是什么游戏</h2>
    <ul>
      <li>在诺玛大陆的大地图上带兵行军、跑商、接委托，为一国效力或自立门户。</li>
      <li>战斗是即时的：像素小人组成的军阵，可以指挥全军，也可以亲自上阵。</li>
      <li>经营自己的城：划城区、摆建筑、理顺动线，委任总督。</li>
      <li>各国政体不同，家族各有利益；战争要争取支持，冲突会一步步升级。</li>
    </ul>
  </section>
  <section class="plate">
    <h2>现在的状态</h2>
    <p>游戏还在内部测试，安装包暂时由制作组直接发放。</p>
    <p>已安装的版本可以在标题画面点「检查更新」，从这里取得新版本。</p>
  </section>
  <footer>征服与统治 官网</footer>
</main>
</body>
</html>
